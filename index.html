<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOMSCROLL - Networked Installation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        /* The main rendering stage (Projection) */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* UI Overlay for controls/status */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px; /* Spans full width now to hold right-aligned button */
            height: 0;   /* Don't block clicks in the middle */
            color: #0f0;
            z-index: 100;
            pointer-events: none; /* Let clicks pass through empty areas */
            mix-blend-mode: difference;
            display: flex;
            justify-content: space-between; /* Spreads content left/right */
        }

        /* Controls container needs pointer events back */
        #status {
            pointer-events: auto; 
        }

        /* Hide UI Button */
        #btn-hide-ui {
            pointer-events: auto;
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 5px 10px;
            cursor: pointer;
            height: 30px;
            font-weight: bold;
        }
        
        #btn-hide-ui:hover {
            background: #0f0;
            color: #000;
        }

        /* Initial Entry Screen */
        #entry-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .mode-btn {
            background: #fff;
            color: #000;
            border: 2px solid #fff;
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.2s;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .mode-btn:hover {
            background: #0f0;
            color: #000;
            border-color: #0f0;
        }

        .mode-btn.secondary {
            background: transparent;
            color: #fff;
            border: 1px solid #666;
            font-size: 18px;
        }

        /* Camera Mode UI (Mobile) */
        #camera-ui {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            z-index: 150;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        #camera-preview {
            width: 90%;
            height: 60%;
            background: #222;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }
        
        #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .camera-controls {
            display: flex;
            gap: 20px;
        }

        /* Hidden File Input */
        #file-input {
            display: none;
        }

        .cam-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: #f00;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        
        .cam-btn:active {
            transform: scale(0.95);
        }

        /* Debug & Info */
        #status-text {
            color: #0f0;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }

        .instructions {
            margin-top: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            display: none; /* Hidden until projection starts */
        }

        #keystone-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- ENTRY SCREEN (Mode Selection) -->
    <div id="entry-screen">
        <h1 style="color:white; margin-bottom: 40px;">DOOMSCROLL</h1>
        <button class="mode-btn" id="btn-projection">START PROJECTION</button>
        <button class="mode-btn secondary" id="btn-camera">OPEN CAMERA</button>
        <div id="network-status" style="color: #666; font-size: 12px; margin-top: 20px;">Connecting to Cloud...</div>
    </div>

    <!-- PROJECTION UI -->
    <div id="ui-layer">
        <div id="status" class="instructions">
            <p>ACTIVE SCREENS: <span id="screen-count">1</span></p>
            <p>CLOUD PHOTOS: <span id="photo-count">0</span></p>
            <hr>
            <p>[SPACE] - Split Screens</p>
            <p>[BACKSPACE] - Merge Screens</p>
            <p>[S] - Random Swipe</p>
            <p>[1-4] - Select Corner</p>
            <p>[ARROWS] - Move Corner</p>
            <p>[H] - Toggle UI</p>
        </div>
        <button id="btn-hide-ui">HIDE UI [H]</button>
    </div>

    <div id="keystone-indicator"></div>

    <!-- MOBILE CAMERA UI -->
    <div id="camera-ui">
        <h2 style="margin: 0 0 20px 0;">CONTRIBUTOR</h2>
        <div id="camera-preview">
            <span style="color: #666">Tap Red Button</span>
            <img id="preview-img">
        </div>
        <div id="status-text">Ready to upload</div>
        <div class="camera-controls">
            <!-- Label acts as button for file input -->
            <label for="file-input" class="cam-btn">SNAP</label>
        </div>
        <input type="file" id="file-input" accept="image/*" capture="environment">
    </div>
    
    <canvas id="stage"></canvas>

    <!-- FIREBASE & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE SETUP ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        let currentUser = null;
        const statusEl = document.getElementById('network-status');

        // Robust Auth Flow
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } catch (e) {
                    console.error("Token auth failed, falling back to anonymous", e);
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }
        };

        // Listen for auth state changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                statusEl.innerText = "Connected: " + user.uid.substring(0, 5);
                statusEl.style.color = "#0f0";
            } else {
                statusEl.innerText = "Disconnected";
                statusEl.style.color = "#f00";
            }
        });

        // Trigger auth
        initAuth();

        // --- GLOBAL APP STATE ---
        const CONFIG = {
            scrollSpeedBase: 0,   
            maxScreens: 512,       
            hues: [355, 340, 0, 5, 20, 55, 80, 25],
            friction: 0.993,
            minVelocity: 0.05,
            impulseStrength: 1,   
            snapThreshold: 0.5,   
            snapStrength: 0.05,    
            verticalGap: 10,        
            keystoneCorners: [[0,0], [0,0], [0,0], [0,0]], 
            selectedCorner: 0     
        };

        let screens = [];
        let dyingScreens = [];
        let animationId;
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        // --- CONTENT MANAGER (CLOUD VERSION) ---
        const ContentManager = {
            capturedPhotos: [], // Stores actual Image objects
            
            initProjection() {
                if (!currentUser) return; // Wait for auth
                
                // Listen for new photos in Firestore
                // Path: /artifacts/{appId}/public/data/photos
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'photos'));
                
                onSnapshot(q, (snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const data = change.doc.data();
                            if (data.base64) {
                                this.loadImage(data.base64);
                            }
                        }
                    });
                }, (error) => {
                    console.error("Firestore Listen Error:", error);
                    alert("Network Error: " + error.message);
                });
            },

            loadImage(base64) {
                const img = new Image();
                img.onload = () => {
                    this.capturedPhotos.push(img);
                    document.getElementById('photo-count').innerText = this.capturedPhotos.length;
                    
                    // Flash effect on UI to show arrival?
                    const status = document.getElementById('photo-count');
                    status.style.color = '#fff';
                    setTimeout(() => status.style.color = '#0f0', 500);
                };
                img.src = base64;
            },

            // Called by Camera Mode to upload
            async uploadPhoto(base64Data) {
                if (!currentUser) return;
                
                const status = document.getElementById('status-text');
                status.innerText = "Uploading...";
                
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'photos'), {
                        base64: base64Data,
                        timestamp: serverTimestamp(),
                        author: currentUser.uid
                    });
                    status.innerText = "Success! Photo sent to wall.";
                    status.style.color = "#0f0";
                    setTimeout(() => {
                        status.innerText = "Ready to upload"; 
                        status.style.color = "#0f0";
                    }, 2000);
                } catch (e) {
                    console.error("Upload failed", e);
                    status.innerText = "Error: " + e.message;
                    status.style.color = "#f00";
                }
            },

            getNextContent() {
                // Same logic as before, but using cloud photos
                const photoProb = Math.min(this.capturedPhotos.length * 0.05, 0.8); 
                const stableHue = CONFIG.hues[Math.floor(Math.random() * CONFIG.hues.length)];
                
                const gradientParams = {
                    angle: Math.random() * Math.PI * 2, 
                    focusX: 0.3 + Math.random() * 0.4, 
                    focusY: 0.2 + Math.random() * 0.4
                };
                const brightness = 0.7 + Math.random() * 0.6;

                if (this.capturedPhotos.length > 0 && Math.random() < photoProb) {
                    const idx = Math.floor(Math.random() * this.capturedPhotos.length);
                    return { 
                        type: 'photo', 
                        val: this.capturedPhotos[idx],
                        baseHue: stableHue, 
                        gradient: gradientParams, 
                        brightness: brightness 
                    };
                } else {
                    return { 
                        type: 'color', 
                        baseHue: stableHue, 
                        gradient: gradientParams,
                        brightness: brightness
                    };
                }
            }
        };

        // --- CAMERA MODE LOGIC (MOBILE) ---
        const CameraApp = {
            init() {
                document.getElementById('entry-screen').style.display = 'none';
                document.getElementById('camera-ui').style.display = 'flex';
                document.getElementById('ui-layer').style.display = 'none'; // Hide projection UI
                
                const fileInput = document.getElementById('file-input');
                
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        this.processFile(e.target.files[0]);
                    }
                });
            },

            processFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // Compress Image logic
                        const cvs = document.createElement('canvas');
                        const ctx = cvs.getContext('2d');
                        
                        // Max dimension 500px (to keep Firestore doc size low)
                        const maxDim = 500;
                        let w = img.width;
                        let h = img.height;
                        
                        if (w > h) {
                            if (w > maxDim) { h *= maxDim / w; w = maxDim; }
                        } else {
                            if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                        }
                        
                        cvs.width = w;
                        cvs.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        // Convert to base64 jpeg
                        const base64 = cvs.toDataURL('image/jpeg', 0.7);
                        
                        // Show preview
                        const preview = document.getElementById('preview-img');
                        preview.src = base64;
                        preview.style.display = 'block';
                        
                        // Upload
                        ContentManager.uploadPhoto(base64);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        // --- UI EVENT HANDLERS ---
        
        // Start Projection
        document.getElementById('btn-projection').addEventListener('click', () => {
            if (!currentUser) { alert("Still connecting to network..."); return; }
            
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('status').style.display = 'block';
            
            AudioEngine.init();
            ContentManager.initProjection(); // Start listening for photos
            
            // Start App
            screens.push(new ScrollInstance(0, 0, canvas.width, canvas.height));
            recalculateLayout();
            applyKeystone();
            AutoSequencer.start();
            animate();
        });

        // Start Camera
        document.getElementById('btn-camera').addEventListener('click', () => {
            if (!currentUser) { alert("Still connecting to network..."); return; }
            CameraApp.init();
        });


        // --- AUDIO ENGINE ---
        const AudioEngine = {
            ctx: null,
            scrollBuffers: [],
            
            init() {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.loadSounds();
            },

            async loadSounds() {
                const files = ['s1.mp3', 's2.mp3', 's3.mp3', 's4.mp3'];
                for (const file of files) {
                    try {
                        const response = await fetch(file);
                        const arrayBuffer = await response.arrayBuffer();
                        const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                        this.scrollBuffers.push(audioBuffer);
                        console.log("Loaded sound:", file);
                    } catch(e) {
                        console.warn("Audio file not found or failed to load:", file);
                    }
                }
            },

            playScrollSound(pitchVariance) {
                if (!this.ctx) return;
                
                // If samples are loaded, use them
                if (this.scrollBuffers.length > 0) {
                    const source = this.ctx.createBufferSource();
                    // Pick random buffer
                    source.buffer = this.scrollBuffers[Math.floor(Math.random() * this.scrollBuffers.length)];
                    
                    const gain = this.ctx.createGain();
                    
                    // Pitch/Speed variation:
                    // Base 1.0 + slight random flux + intensity variance
                    // pitchVariance is approx 0 (gentle) to 0.5 (aggressive)
                    const speed = 0.95 + (Math.random() * 0.1) + (pitchVariance * 0.4);
                    source.playbackRate.value = speed;
                    
                    // Volume adjustment based on intensity
                    gain.gain.value = 0.4 + (pitchVariance * 0.4); 
                    
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(0);
                } else {
                    // Fallback to Synth if no files loaded
                    this.playSynthScroll(pitchVariance);
                }
            },

            playSynthScroll(pitchVariance) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                const freq = 200 + (Math.random() * 400) + (pitchVariance * 100);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, this.ctx.currentTime + 0.1);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },

            playSplitSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(60, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            },
            playMergeSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(30, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.7);
            }
        };

        // --- AUTO SEQUENCER ---
        const AutoSequencer = {
            timer: null,
            direction: 1, 
            getTimeRange(count) {
                // If merging (going down), use fixed 4 seconds
                if (this.direction === -1) {
                    return [2, 2];
                }
                
                // If splitting (going up), use the organic timing curve
                if (count === 1) return [110, 220];
                if (count === 2) return [30, 90];
                if (count === 4) return [15, 18];
                if (count === 8) return [10, 14];
                if (count < CONFIG.maxScreens) return [6, 8];
                
                // Peak (Max Screens) - Hold for 6 seconds before reversing
                return [6, 6]; 
            },
            start() { this.scheduleNextAction(); },
            reset() { if (this.timer) clearTimeout(this.timer); this.scheduleNextAction(); },
            scheduleNextAction() {
                const count = screens.length;
                
                // Determine direction
                if (count >= CONFIG.maxScreens) this.direction = -1;
                else if (count <= 1) this.direction = 1;
                
                const range = this.getTimeRange(count);
                const delay = (range[0] + Math.random() * (range[1] - range[0])) * 1000;
                
                // console.log(`Next Action: ${this.direction === 1 ? 'Split' : 'Merge'} in ${delay}ms`);
                
                this.timer = setTimeout(() => {
                    if (this.direction === 1) splitScreens();
                    else mergeScreens();
                }, delay);
            }
        };

        // --- VISUALIZATION CLASSES & LOGIC ---

        class ScrollInstance {
            constructor(x, y, w, h) {
                this.x = x; this.y = y; this.w = w; this.h = h;
                this.targetX = x; this.targetY = y; this.targetW = w; this.targetH = h;
                this.cardWidth = 0; this.cardHeight = 0; this.cardGap = 0; this.cardRadius = 0;
                this.calculateDimensions();
                this.scrollY = 0;
                this.velocity = 0;
                this.timeToNextScroll = Math.random() * 2000; 
                this.lastActionTime = Date.now();
                this.mergeTarget = null; 
                this.cards = [];
                this.generateInitialCards();
                this.swiping = false; this.swipeOffset = 0; this.swipeTarget = 0; 
            }

            resize(x, y, w, h) {
                this.targetX = x; this.targetY = y; this.targetW = w; this.targetH = h;
            }

            calculateDimensions() {
                const padding = Math.min(this.w, this.h) * 0.05; 
                this.cardWidth = this.w - (padding * 2);
                this.cardHeight = this.h - (padding * 2);
                this.cardGap = this.cardHeight * 0.25; 
                const minDim = Math.min(this.cardWidth, this.cardHeight);
                this.cardRadius = minDim * 0.08;
            }

            repositionCards() {
                if (this.cards.length === 0) return;
                for (let i = 0; i < this.cards.length; i++) {
                    if (i > 0) this.cards[i].y = this.cards[i-1].y + this.cardHeight + this.cardGap;
                }
                for (let i = 1; i < this.cards.length; i++) {
                     this.cards[i].y = this.cards[i-1].y + this.cardHeight + this.cardGap;
                }
            }

            generateInitialCards() { for(let i=0; i<5; i++) this.addCard(); }

            addCard() {
                let nextY = 0;
                if (this.cards.length > 0) nextY = this.cards[this.cards.length-1].y + this.cardHeight + this.cardGap;
                this.cards.push({ y: nextY, content: ContentManager.getNextContent() });
            }

            triggerSwipe() {
                if(this.swiping) return;
                this.swiping = true; this.swipeTarget = -this.w * 1.5;
            }

            flick(intensity = 1.0) {
                this.velocity += CONFIG.impulseStrength * intensity;
                if (intensity > 1.2) AudioEngine.playScrollSound(0.5); else AudioEngine.playScrollSound(0);
            }

            update() {
                const now = Date.now();
                
                // Morphing
                const ease = 0.05; 
                const dist = Math.abs(this.targetX - this.x) + Math.abs(this.targetY - this.y) + Math.abs(this.targetW - this.w);
                if (dist > 0.5) {
                    this.x += (this.targetX - this.x) * ease;
                    this.y += (this.targetY - this.y) * ease;
                    this.w += (this.targetW - this.w) * ease;
                    this.h += (this.targetH - this.h) * ease;
                    this.calculateDimensions();
                    this.repositionCards();
                } else {
                    this.x = this.targetX; this.y = this.targetY; this.w = this.targetW; this.h = this.targetH;
                }

                // AI
                const isMovingFast = Math.abs(this.velocity) > 1.5;
                if (!this.swiping && now - this.lastActionTime > this.timeToNextScroll) {
                    if (isMovingFast && Math.random() > 0.1) {
                        this.timeToNextScroll = 500; 
                    } else {
                        const r = Math.random();
                        if (r > 0.9) {
                            // DOOM SCROLL (Aggressive)
                            this.flick(0.9 + Math.random());
                            this.timeToNextScroll = 1000 + Math.random() * 2000; 
                        } else if (r > 0.45) {
                            // CASUAL READ (Standard)
                            this.flick(0.5 + Math.random() * 0.5);
                            this.timeToNextScroll = 2000 + Math.random() * 4000;
                        } else if (r > 0.15) {
                            // MICRO NUDGE (Keep alive)
                            this.flick(0.2); 
                            this.timeToNextScroll = 500 + Math.random() * 1000;
                        } else {
                            // SCROLL BACK (Interest caught)
                            // A gentle nudge upwards, weaker than the downward scroll
                            this.flick(-0.2); 
                            this.timeToNextScroll = 1500 + Math.random() * 2000; // Pause to "read"
                        }
                        this.lastActionTime = now;
                    }
                }

                // Physics
                if(!this.swiping) {
                    this.scrollY += this.velocity;
                    this.velocity *= CONFIG.friction;
                    if (Math.abs(this.velocity) < CONFIG.snapThreshold && Math.abs(this.velocity) > 0) {
                        let closestDist = Infinity;
                        let snapTarget = this.scrollY;
                        this.cards.forEach(card => {
                            const cardCenter = card.y + (this.cardHeight / 2);
                            const dist = cardCenter - this.scrollY;
                            if (Math.abs(dist) < Math.abs(closestDist)) { closestDist = dist; snapTarget = cardCenter; }
                        });
                        const error = snapTarget - this.scrollY;
                        if (Math.abs(error) > 1) { this.velocity += error * CONFIG.snapStrength; this.velocity *= 0.8; }
                        else if (Math.abs(this.velocity) < 0.1) { this.scrollY = snapTarget; this.velocity = 0; }
                    }
                } else {
                    this.swipeOffset += (this.swipeTarget - this.swipeOffset) * 0.1;
                    if(Math.abs(this.swipeTarget - this.swipeOffset) < 1) { this.swiping = false; this.swipeOffset = 0; this.velocity = 50; }
                }

                // Infinite Scroll
                const buffer = this.h * 1.5;
                if (this.cards[0].y + this.cardHeight - this.scrollY < -buffer) this.cards.shift();
                if (this.cards[this.cards.length-1].y - this.scrollY > this.h + buffer) this.cards.pop();
                const lastCard = this.cards[this.cards.length-1];
                if (lastCard.y - this.scrollY < this.h + this.cardHeight) {
                    const newY = lastCard.y + this.cardHeight + this.cardGap;
                    this.cards.push({ y: newY, content: ContentManager.getNextContent() });
                    if (this.velocity > 15 && Math.random() < 0.3) AudioEngine.playScrollSound(this.cards.length);
                }
                const firstCard = this.cards[0];
                if (firstCard.y - this.scrollY > -this.cardHeight) {
                    const newY = firstCard.y - this.cardHeight - this.cardGap;
                    this.cards.unshift({ y: newY, content: ContentManager.getNextContent() });
                }
            }

            draw(ctx) {
                ctx.save();
                const minDim = Math.min(this.w, this.h);
                const cellRadius = minDim * 0.1; 
                this.drawRoundedRect(ctx, this.x, this.y, this.w, this.h, cellRadius);
                ctx.clip();
                ctx.fillStyle = '#000';
                this.drawRoundedRect(ctx, this.x, this.y, this.w, this.h, cellRadius);
                ctx.fill();
                ctx.translate(this.swipeOffset, 0);

                this.cards.forEach(card => {
                    const drawY = this.y + card.y - this.scrollY + (this.h/2);
                    if (drawY + this.cardHeight > this.y && drawY < this.y + this.h) {
                        const cardX = this.x + (this.w - this.cardWidth)/2;
                        const gParams = card.content.gradient || { angle: Math.PI/4, focusX: 0.3, focusY: 0.3 };
                        const h = card.content.baseHue || card.content.type === 'color' ? card.content.baseHue : 0;
                        const b = card.content.brightness || 1.0;
                        
                        const hlX = cardX + this.cardWidth * gParams.focusX;
                        const hlY = drawY + this.cardHeight * gParams.focusY;
                        const radGrad = ctx.createRadialGradient(hlX, hlY, this.cardWidth*0.1, hlX, hlY, this.cardWidth*3);
                        radGrad.addColorStop(0, `hsla(${h}, 100%, 5%, 0.2)`); 
                        radGrad.addColorStop(1, `hsla(${h}, 100%, 50%, 0)`);

                        const cx = cardX + this.cardWidth/2;
                        const cy = drawY + this.cardHeight/2;
                        const r = Math.sqrt((this.cardWidth/2)**2 + (this.cardHeight/2)**2);
                        const startX = cx + Math.cos(gParams.angle + Math.PI) * r;
                        const startY = cy + Math.sin(gParams.angle + Math.PI) * r;
                        const endX = cx + Math.cos(gParams.angle) * r;
                        const endY = cy + Math.sin(gParams.angle) * r;
                        const linGrad = ctx.createLinearGradient(startX, startY, endX, endY);
                        linGrad.addColorStop(0.0, `hsl(${h + 15}, 90%, ${65 * b}%)`);
                        linGrad.addColorStop(0.25, `hsl(${h + 5}, 85%, ${55 * b}%)`);
                        linGrad.addColorStop(0.5, `hsl(${h}, 80%, ${50 * b}%)`);
                        linGrad.addColorStop(0.8, `hsl(${h - 10}, 90%, ${35 * b}%)`);
                        linGrad.addColorStop(1.0, `hsl(${h - 20}, 100%, ${20 * b}%)`);
                        
                        this.drawRoundedRect(ctx, cardX, drawY, this.cardWidth, this.cardHeight, this.cardRadius);
                        
                        if (card.content.type === 'color') {
                            ctx.fillStyle = linGrad; ctx.fill(); ctx.fillStyle = radGrad; ctx.fill();
                        } else {
                            ctx.fillStyle = linGrad; ctx.fill();
                            ctx.save(); ctx.clip(); 
                            ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.8; 
                            
                            // IMAGE ASPECT RATIO FIX (Cover Mode)
                            const img = card.content.val;
                            if (img.width && img.height) { // Ensure image is loaded
                                const imgRatio = img.width / img.height;
                                const targetRatio = this.cardWidth / this.cardHeight;
                                let sx, sy, sw, sh;

                                if (imgRatio > targetRatio) {
                                    // Image is wider than shape: Crop width
                                    sh = img.height;
                                    sw = sh * targetRatio;
                                    sy = 0;
                                    sx = (img.width - sw) / 2;
                                } else {
                                    // Image is taller than shape: Crop height
                                    sw = img.width;
                                    sh = sw / targetRatio;
                                    sx = 0;
                                    sy = (img.height - sh) / 2;
                                }
                                ctx.drawImage(img, sx, sy, sw, sh, cardX, drawY, this.cardWidth, this.cardHeight);
                            }
                            
                            ctx.restore();
                        }
                    }
                });
                ctx.restore();
            }

            drawRoundedRect(ctx, x, y, w, h, r) {
                if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }
        }

        // --- LAYOUT ENGINE ---
        const SPLIT_HISTORY = ['H', 'H', 'V', 'H', 'V', 'H', 'V', 'H', 'V'];

        function getGridDimensions(count) {
            if (count === 0) return { cols: 1, rows: 1 };
            const depth = Math.log2(count);
            let c = 0; let r = 0;
            for (let i = 0; i < depth; i++) { if (SPLIT_HISTORY[i] === 'H') c++; else r++; }
            return { cols: Math.pow(2, c), rows: Math.pow(2, r) };
        }

        function getGridPosition(index, count) {
            const depth = Math.log2(count);
            let col = 0; let row = 0;
            for (let k = 0; k < depth; k++) {
                const splitIndex = depth - 1 - k;
                const type = SPLIT_HISTORY[splitIndex];
                const bit = (index >> k) & 1;
                if (type === 'H') {
                    let h_after = 0;
                    for (let j = splitIndex + 1; j < depth; j++) { if (SPLIT_HISTORY[j] === 'H') h_after++; }
                    col += bit * Math.pow(2, h_after);
                } else {
                    let v_after = 0;
                    for (let j = splitIndex + 1; j < depth; j++) { if (SPLIT_HISTORY[j] === 'V') v_after++; }
                    row += bit * Math.pow(2, v_after);
                }
            }
            return { col, row };
        }

        function recalculateLayout() {
            if (screens.length === 0) return;
            const count = screens.length;
            const { cols, rows } = getGridDimensions(count);
            const slotW = canvas.width / cols;
            const totalVerticalGap = (rows > 1) ? CONFIG.verticalGap * (rows - 1) : 0;
            const slotH = (canvas.height - totalVerticalGap) / rows;
            const slotRatio = slotW / slotH;
            let targetRatio = slotRatio;
            targetRatio = Math.max(0.5, Math.min(targetRatio, 0.77));

            screens.forEach((screen, i) => {
                const pos = getGridPosition(i, count);
                const col = pos.col;
                const row = pos.row;
                let cellW, cellH;
                if (slotRatio > targetRatio) { cellH = slotH; cellW = cellH * targetRatio; } 
                else { cellW = slotW; cellH = cellW / targetRatio; }
                const x = (col * slotW) + (slotW - cellW) / 2;
                const y = (row * slotH) + (row * CONFIG.verticalGap) + (slotH - cellH) / 2;
                screen.resize(x, y, cellW, cellH);
            });
        }

        function splitScreens() {
            if (screens.length >= CONFIG.maxScreens) return;
            AudioEngine.playSplitSound();
            const currentCount = screens.length;
            const nextGeneration = []; 
            for (let i = 0; i < currentCount; i++) {
                const parent = screens[i];
                const child = new ScrollInstance(parent.x, parent.y, parent.w, parent.h);
                child.scrollY = parent.scrollY; child.velocity = parent.velocity;
                child.cardWidth = parent.cardWidth; child.cardHeight = parent.cardHeight; child.cardGap = parent.cardGap;
                child.cards = parent.cards.map(c => ({ y: c.y, content: c.content }));
                
                // Fix for "Erratic" start: Delay the AI for new screens so they don't ALL flick immediately
                child.timeToNextScroll = 1000 + Math.random() * 4000; 
                
                nextGeneration.push(parent);
                nextGeneration.push(child);
            }
            screens = nextGeneration;
            recalculateLayout();
            document.getElementById('screen-count').innerText = screens.length;
            AutoSequencer.reset();
        }

        function mergeScreens() {
            if (screens.length <= 1) return;
            AudioEngine.playMergeSound();
            dyingScreens = [];
            const fusedScreens = [];
            for (let i = 0; i < screens.length; i += 2) {
                const parent = screens[i];
                if (i + 1 < screens.length) {
                    const child = screens[i+1];
                    parent.scrollY = (parent.scrollY + child.scrollY) / 2;
                    parent.velocity = (parent.velocity + child.velocity) / 2;
                    child.mergeTarget = parent;
                    dyingScreens.push(child);
                }
                fusedScreens.push(parent);
            }
            screens = fusedScreens;
            recalculateLayout();
            document.getElementById('screen-count').innerText = screens.length;
            AutoSequencer.reset();
        }

        // --- KEYSTONE CORRECTION ---
        function applyKeystone() {
            const saved = localStorage.getItem('doomscroll-keystone-corners');
            if (saved) {
                try { CONFIG.keystoneCorners = JSON.parse(saved); } catch(e){}
            } else {
                CONFIG.keystoneCorners = [[0,0], [canvas.width,0], [canvas.width,canvas.height], [0,canvas.height]];
            }
            updateKeystoneTransform();
        }

        function solveLinearSystem(A, b) {
            const n = A.length;
            const aug = A.map((row, i) => [...row, b[i]]);
            for (let i = 0; i < n; i++) {
                let maxRow = i;
                for (let k = i + 1; k < n; k++) { if (Math.abs(aug[k][i]) > Math.abs(aug[maxRow][i])) maxRow = k; }
                [aug[i], aug[maxRow]] = [aug[maxRow], aug[i]];
                for (let k = i + 1; k < n; k++) {
                    const factor = aug[k][i] / aug[i][i];
                    for (let j = i; j <= n; j++) aug[k][j] -= factor * aug[i][j];
                }
            }
            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                x[i] = aug[i][n];
                for (let j = i + 1; j < n; j++) x[i] -= aug[i][j] * x[j];
                x[i] /= aug[i][i];
            }
            return x;
        }

        function updateKeystoneTransform() {
            const dst = CONFIG.keystoneCorners;
            // Check identity
            if (dst[0][0]===0 && dst[0][1]===0 && dst[1][0]===canvas.width && dst[2][0]===canvas.width && dst[3][1]===canvas.height) {
                canvas.style.transform = 'none'; return;
            }
            const src = [[0,0], [canvas.width,0], [canvas.width,canvas.height], [0,canvas.height]];
            const A = [], b = [];
            for (let i = 0; i < 4; i++) {
                const [sx, sy] = src[i]; const [dx, dy] = dst[i];
                A.push([sx, sy, 1, 0, 0, 0, -sx * dx, -sy * dx]); b.push(dx);
                A.push([0, 0, 0, sx, sy, 1, -sx * dy, -sy * dy]); b.push(dy);
            }
            let h; try { h = solveLinearSystem(A, b); } catch(e) { h=[1,0,0,0,1,0,0,0]; }
            
            const matrix3d = `matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,1)`;
            canvas.style.transform = matrix3d;
            canvas.style.transformOrigin = '0 0';
        }

        window.moveCorner = function(dx, dy) {
            const corner = CONFIG.keystoneCorners[CONFIG.selectedCorner];
            corner[0]+=dx; corner[1]+=dy;
            localStorage.setItem('doomscroll-keystone-corners', JSON.stringify(CONFIG.keystoneCorners));
            updateKeystoneTransform();
        }
        
        window.selectCorner = function(idx) { CONFIG.selectedCorner = idx; }
        
        window.resetKeystone = function() {
            CONFIG.keystoneCorners = [[0,0], [canvas.width,0], [canvas.width,canvas.height], [0,canvas.height]];
            localStorage.removeItem('doomscroll-keystone-corners');
            updateKeystoneTransform();
        }

        // --- ANIMATION LOOP ---
        function animate() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const nextDying = [];
            dyingScreens.forEach(dead => {
                if (dead.mergeTarget) {
                    dead.targetX = dead.mergeTarget.targetX; dead.targetY = dead.mergeTarget.targetY;
                    dead.targetW = dead.mergeTarget.targetW; dead.targetH = dead.mergeTarget.targetH;
                }
                dead.update();
                dead.draw(ctx);
                const dist = Math.abs(dead.x - dead.targetX) + Math.abs(dead.y - dead.targetY) + Math.abs(dead.w - dead.targetW);
                if (dist > 2) nextDying.push(dead);
            });
            dyingScreens = nextDying;

            screens.forEach(screen => {
                screen.update();
                screen.draw(ctx);
            });
            animationId = requestAnimationFrame(animate);
        }

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            // Keystone
            if (e.code.startsWith('Digit') && e.key >= 1 && e.key <= 4) selectCorner(parseInt(e.key)-1);
            if (e.code === 'ArrowLeft') moveCorner(-5, 0);
            if (e.code === 'ArrowRight') moveCorner(5, 0);
            if (e.code === 'ArrowUp') moveCorner(0, -5);
            if (e.code === 'ArrowDown') moveCorner(0, 5);
            if (e.code === 'KeyR' && !e.shiftKey) resetKeystone();
            
            // Toggle UI
            if (e.code === 'KeyH') toggleUI();

            // App
            if (e.code === 'Space') splitScreens();
            if (e.code === 'Backspace') mergeScreens();
            if (e.code === 'KeyS' && screens.length) screens[Math.floor(Math.random()*screens.length)].triggerSwipe();
        });

        // Add this missing function back
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            recalculateLayout();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
